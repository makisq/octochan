# Словарь пакета pgconf: слова области, которые скилл приносит в
# формальный промпт через import @pgconf. Остальные слова примера —
# в базовом словаре (ochan fp words).
#
# Слово: ровно n его смыслов (senses) и nl — смыслов у слова в
# естественном языке, по WordNet 3.0. 1 ≤ n < nl.
words:
  connections: {senses: [Limit], nl: 9}  # nl — по connection
