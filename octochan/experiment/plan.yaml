# Параметры эксперимента 9.2 — фиксируются до замера (раздел 9.2 манифеста).
# Менять их после первого прогона нельзя: иначе подбором можно получить
# любой вывод. Новая версия плана — новый эксперимент.
version: 1
fixed: 2026-11-01

# Прогонов на одну запись задачи: согласованность ĉ — по парам прогонов.
runs_per_writing: 3

# Порог кольца 0 и порог кольца 2 — как в настройках по умолчанию.
tau: 0.42
well_true: 0.5

# Веса вопросов (А.5): w(q) = 1 + n(q), n — отношения задачи, опирающиеся
# на класс цели вопроса; считаются при подготовке задачи и хранятся в ней.
weights: "1 + n(q)"

# Условие 4 — своя архитектурная модель; версии для H4 — разные модели
# той же линии.
architectural:
  model: own-small-2
  versions: [own-small, own-small-2, own-small-2-int8, own-small-2-int4]

# Условия 1–3 — одна внешняя модель (протокольный подход). Не выбрана.
external: null

# Гипотезы — дословно из раздела 9.2; что опровергает подход — раздел 9.3.
hypotheses:
  H1: согласованность перефразировок у формального промпта выше, чем у естественного языка
  H2: ошибок меньше, и большая часть оставшихся поймана арбитрами или видна в отчёте
  H3: при недостающей предпосылке формальный промпт даёт ошибку, а не догадку
  H4: при смене версии модели планы формального промпта меняются реже
  H5: каждое внутреннее кольцо повышает согласованность или снижает долю отказов арбитра, и цена приемлема
  H6: после калибровки итоговые оценки пакетов совпадают с наблюдаемыми долями верных решений
  H7: среди записей одной задачи согласованность и правильность связаны положительно
