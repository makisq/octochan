id: k8s_secret_rotation
domain: Kubernetes
status: 'черновик: эталон и пересказы утверждает владелец'
intended:
  rate: weekly
open: []
weights:
  rate: 3
natural:
- 'Ротация токенов сервиса: ежедневно или еженедельно; расписание говорит — раз в неделю.'
- Секрет крутим daily или weekly (неточно), по расписанию — weekly.
formal:
- "goal: safe\n\nclasses:\n  Secret   : \"token\"\n  Schedule : \"schedule\"\n  Service  : \"service\"\
  \n  Safety   : \"safe\"\n\nrelations:\n  Schedule --defines--> Secret (token_schedule)\n  Secret --modifies-->\
  \ Service (token_change)\n  Service --strives_to--> Safety\n\ncell c1:\n  set Schedule.rate = weekly\n\
  \  set Secret.rate = {daily, weekly}\n"
- "goal: safe\n\nclasses:\n  Secret   : \"certificate\"\n  Schedule : \"schedule\"\n  Service  : \"service\"\
