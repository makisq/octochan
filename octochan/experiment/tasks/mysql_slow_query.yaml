  \ State\n\ncell c1:\n  set Log.threshold = 1..5 s\n  set Latency.threshold = 2 s\n"
- "goal: tuned\n\nclasses:\n  Query   : \"query\"\n  Latency : \"delay\"\n  Log     : \"journal\"\n  State\
