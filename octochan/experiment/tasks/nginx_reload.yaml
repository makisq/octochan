natural:
- 'Перечитай конфигурацию nginx на узлах группы web: версия конфига 42, в группе 10 узлов. Записывать
  можно только web_config.'
- Примени конфиг версии 42 к nginx на всех десяти узлах web и перезагрузи его; запись разрешена только
  в web_config.
formal:
