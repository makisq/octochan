  maximum: '300'
open: []
weights:
  buffer_size: 3
  maximum: 3
natural:
- Подними предел соединений PostgreSQL до 300 и дай каждому 64 МБ буфера; бюджет памяти ограничивает соединения.
- 'Postgres: максимум соединений 300, буфер 64 MB; память задаёт рамки соединениям, соединения меняют
  конфиг.'
formal:
- "goal: tuned\n\nclasses:\n  Connection : \"connection\"\n  Memory     : \"memory\"\n  Config     : \"\
  config\"\n  State      : \"tuned\"\n\nrelations:\n  Memory --limits--> Connection (memory_budget)\n\
  \  Connection --modifies--> Config (session_limit)\n  Config --strives_to--> State\n\npriority:\n  Memory\
  \ < Connection\n\ncell c1:\n  set Memory.buffer_size = 64 MB\n  set Connection.maximum = 300\n"
