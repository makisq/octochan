# Базовый словарь формального промпта — подмножество английского.
#
# Слово языка — ключ words: ровно n его смыслов (senses, классы) и nl —
# сколько смыслов у слова в естественном языке, по WordNet 3.0 (все
# части речи). 1 ≤ n < nl; у слова с одним смыслом в языке (nl = 1) n = 1.
# Потолок n для всего языка — fp.max_meanings в config.yaml: слово с
# большим числом смыслов при таком потолке в язык не входит.
#
# function — служебные слова: класса у них нет, они только связывают
# части составного имени (stop_before_detour). units — единицы измерения
# после чисел. Слова области приносят словари скиллов (lexicon.yaml
# пакета), свои — словари оператора (fp.lexicons).
